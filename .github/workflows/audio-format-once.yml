name: Temporary audio integration formatter
on:
  push:
    branches: [feature/fmod-audio-support]
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fmod-audio-support
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Rust formatting on the feature branch
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/evolve-core/src/fmod.rs crates/evolve-core/src/inventory.rs crates/evolve-core/src/lib.rs
            git add crates/evolve-desktop/src/audio_tools.rs crates/evolve-desktop/src/main.rs
            git add crates/evolve-desktop/src/settings.rs crates/evolve-desktop/src/settings_page.rs
            git add crates/evolve-desktop/src/asset_viewer.rs crates/evolve-desktop/src/gfx_bundled_tools.rs
            git add crates/evolve-desktop/src/gfx_tool_install.rs
            git commit -m "style: format FMOD audio integration"
            git push origin HEAD:feature/fmod-audio-support
          fi
