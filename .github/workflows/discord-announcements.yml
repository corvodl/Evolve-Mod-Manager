name: Publish Discord announcement feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/discord-announcements.yml"
      - "scripts/publish_discord_announcements.py"
      - "scripts/test_publish_discord_announcements.py"

permissions:
  contents: read

concurrency:
  group: evolve-discord-announcements-pages
  cancel-in-progress: true

jobs:
  publish:
    # Secrets are deliberately never exposed in PR builds or the desktop.
    if: github.repository == 'corvodl/EMM-SRC' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify announcement feed sanitization
        run: python3 -m unittest discover -s scripts -p 'test_publish_discord_announcements.py'
      - name: Fetch Discord channel posts (private credentials)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          mkdir -p site
          python3 scripts/publish_discord_announcements.py --output site/announcements.json
      - name: Publish announcements to public repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          sha=$(gh api repos/corvodl/Evolve-Mod-Manager/contents/announcements.json --jq .sha 2>/dev/null || echo "")
          base64_content=$(base64 -w 0 site/announcements.json)
          if [ -n "$sha" ]; then
            gh api --method PUT repos/corvodl/Evolve-Mod-Manager/contents/announcements.json \
              -f message="chore(feed): update Discord announcements feed" \
              -f content="$base64_content" \
              -f sha="$sha"
          else
            gh api --method PUT repos/corvodl/Evolve-Mod-Manager/contents/announcements.json \
              -f message="chore(feed): update Discord announcements feed" \
              -f content="$base64_content"
          fi
