name: Temporary FSB5 feature formatter
on:
  push:
    branches: [feature/fmod-audio-support]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fmod-audio-support
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and push this feature branch
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/evolve-core/src/fsb5_rebuild.rs crates/evolve-core/src/lib.rs
            git add crates/evolve-desktop/src/audio_tools.rs crates/evolve-desktop/src/main.rs
            git add crates/evolve-desktop/src/asset_viewer.rs crates/evolve-desktop/src/settings.rs
            git add crates/evolve-desktop/src/settings_page.rs crates/evolve-desktop/src/gfx_tool_install.rs
            git add crates/evolve-desktop/src/gfx_bundled_tools.rs
            git commit -m "style: format native FSB5 compiler"
            git push origin HEAD:feature/fmod-audio-support
          fi
