name: Optional GFX tool bundle smoke test

on:
  pull_request:
    paths:
      - installer/EvolveModManager.iss
      - scripts/package-gfx-tools.ps1
      - .github/workflows/gfx-tools-smoke.yml
      - .github/workflows/nightly.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gfx-bundle:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream tools with pinned hashes and check their contents
        shell: pwsh
        run: |
          ./scripts/package-gfx-tools.ps1
          foreach ($relative in @(
            'FFDec/ffdec-cli.exe', 'FFDec/ffdec.exe', 'FFDec/ffdec.jar',
            'Ruffle/ruffle.exe', 'Ruffle/LICENSE.md', 'THIRD_PARTY_TOOLS.txt'
          )) {
            $path = Join-Path 'dist/third_party' $relative
            if (!(Test-Path $path -PathType Leaf)) { throw "Missing GFX component: $path" }
          }
      # Exercise the real Inno Setup script with harmless placeholder manager
      # executables; no test installer is published or uploaded as a release.
      - name: Smoke-compile optional Inno installer components
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'target/release' | Out-Null
          Set-Content -Path 'target/release/evolve-mod-manager.exe' -Value 'CI placeholder only'
          Set-Content -Path 'target/release/evolve-cli.exe' -Value 'CI placeholder only'
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Failed installing Inno Setup compiler' }
          }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler unavailable' }
          & $compiler '/DAppVersion=0.1.0-ci-gfx' 'installer/EvolveModManager.iss'
          if ($LASTEXITCODE -ne 0) { throw 'GFX installer packaging validation failed' }
          $setup = 'dist/EvolveModManager-Setup-0.1.0-ci-gfx.exe'
          if (!(Test-Path $setup -PathType Leaf)) { throw 'GFX installer artifact missing' }
          $size = (Get-Item $setup).Length / 1MB
          Write-Host "Optional GFX tools setup size: $([math]::Round($size, 1)) MiB (CI placeholder manager EXEs)"
          if ($size -gt 70) { throw 'GFX tool bundle exceeded the 70 MiB packaging budget' }
