name: Nightly 0.1.0 Windows release

on:
  # Publish the first Nightly when this release workflow enters main.
  push:
    branches: [main]
    paths: [".github/workflows/nightly.yml"]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

# Avoid overlapping 20-minute Windows release builds.
concurrency:
  group: evolve-nightly-windows
  # Superseded push builds should not use additional Windows runner time.
  cancel-in-progress: true

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      VERSION: 0.1.0-nightly.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Stamp monotonically increasing Nightly prerelease version
        shell: pwsh
        run: |
          $manifest = Get-Content "Cargo.toml" -Raw
          $original = 'version = "0.1.0"'
          if (!$manifest.Contains($original)) {
            throw "Expected Nightly 0.1.0 base version in workspace Cargo.toml"
          }
          $manifest = $manifest.Replace($original, ('version = "' + $env:VERSION + '"'))
          Set-Content "Cargo.toml" -Value $manifest -Encoding utf8
          Write-Host "Building Nightly $env:VERSION"

      # Core and desktop lint/tests run in CI; compile binaries only once here.
      - run: cargo fmt --all -- --check
      - run: cargo build --release --workspace --bins

      - name: Create portable ZIP (both Windows executables)
        shell: pwsh
        run: |
          $folder = "dist/EvolveModManager-Portable"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          foreach ($name in @("evolve-mod-manager.exe", "evolve-cli.exe")) {
            $source = Join-Path "target/release" $name
            if (!(Test-Path $source)) { throw "Windows executable missing: $name" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $folder $name)
          }
          Copy-Item -LiteralPath "assets/hunt.ico" -Destination "$folder/hunt.ico"
          Copy-Item -LiteralPath "README.md" -Destination "$folder/README.md"
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath "dist/EvolveModManager-Portable-$env:VERSION.zip" -CompressionLevel Optimal -Force

      - name: Fetch and verify optional GFX editor tools
        shell: pwsh
        run: ./scripts/package-gfx-tools.ps1

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup compiler" }
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing: $compiler" }
          & $compiler "/DAppVersion=$env:VERSION" "installer/EvolveModManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed" }

      - name: Verify installer and portable ZIP, prepare SHA256 release notes
        shell: pwsh
        run: |
          $installer = "dist/EvolveModManager-Setup-$env:VERSION.exe"
          $portable = "dist/EvolveModManager-Portable-$env:VERSION.zip"
          foreach ($item in @($installer, $portable)) {
            if (!(Test-Path $item)) { throw "Missing Nightly release asset: $item" }
            if ((Get-Item $item).Length -lt 1024) { throw "Suspiciously small Nightly asset: $item" }
          }
          $body = @(
            "Evolve Mod Manager Nightly 0.1.0 (build $env:VERSION)",
            "",
            "Experimental Windows preview. The manager is not yet feature-complete.",
            "Changes: Grounder/Kraken opacity repair; Kala Banshee Gun animated Decal uses its authored blue tint as a brightness mask, preserving UV movement.",
            "Original emission remains separate from the optional monster armor glow.",
            "Nightly 9: replaced the broken Settings navigation SVG with a standard Lucide gear, preserving the original accent.",
            "Kala (Tech) Model Options: Blue Banshee / Red Armor Reducer tubing selection now follows the original CDF active-attachment visibility groups.",
            "Nightly 13: original public Qt 3-to-100 GlowAmount preview calibration now applies to ALL authored emissive materials, not just Kala.",
            "Optional Stage 2 armor glow remains separate from authored emission and receives the same neutral preview brightness reference without borrowing a material GlowAmount.",
            "Kala: tech_3p.mtl's named body Glow stays its original blue in both weapon states; the previous Armor Reducer red tint override is removed.",
            "Body ALPHAGLOW keeps its source diffuse RGB, including any genuinely red accents. Separate Banshee blue / Armor Reducer red weapon glows retain their original state selection.",
            "Original GlowAmounts, source DDS, emissive UV movement, game files and exported FBX data are unchanged; the Emissive strength slider remains a separate viewport adjustment.",
            "Updater: retains Nightly 8 installer path normalization, clear failure diagnostics, Inno Setup logs and portable locked-file retries.",
            "Nightly 14: Installer now requests administrator consent and installs the admin-required GUI under protected Program Files rather than user-writable AppData.",
            "ONE-TIME MANUAL INSTALL required when upgrading from an older LocalAppData Nightly: run Nightly 14 Setup manually, then use the new Program Files shortcut. Existing per-user settings, backups and Asset Library remain untouched; remove old shortcuts only after verifying the new installation.",
            "Future in-app installer updates work from the new protected location; updater deliberately rejects reinstalling an elevated executable into the old user-writable folder.",
            "Stage 2 monster Full Armor Glow is now simply Glow. It searches the selected source-build Asset Library across PAKs for the original optional glow DDS; switching off removes only that overlay and retains authored Emittance and diffuse.",
            "Kala Armor Reducer extra emissive coefficient adjusted from 4x to 2x to match its previously verified 0.5x slider appearance at the new default 1x.",
            "Nightly 15: includes PR #20 experimental GFX viewer and editing work: source-build UI_Assets DDS atlas reconstruction, native GFX layout editing, external Ruffle ActionScript preview, and FFDec integration.",
            "Nightly 16: merges PR #21 GFX Tools sidebar and original main_menu.gfx ActionScript preview actions, including isolated menu prompts, navigation controls, and verified UI_Data command inspection.",
            "Nightly 17 (PR #22): corrected CryEngine Z-up to glTF Y-up basis for unrigged static model and CDF FBX export without reauthoring UVs or mesh normals.",
            "FBX export reconstructs original per-attachment CryEngine material IDs, retains NoDraw slots, neutral untextured diffuse, and embeds source-verified normal maps directly inside each FBX even with texture embedding OFF. No external normal PNG sidecars.",
            "Nightly 17 (PR #23): GFX Tools adds a persistent isolated Ruffle Web browser preview with source-verified live original ActionScript callback dispatch, menu action sections, explicit unsupported-handler feedback, and movie reset without restarting the preview server.",
            "The installer GFX Tools option includes SHA256-verified Ruffle Web alongside desktop Ruffle and FFDec. A portable build without bundled third-party tools cannot use live GFX preview until the verified web runtime is available.",
            "Nightly 18 (PR #24): FBX exports capture bounded Blender stdout and stderr, exposing the underlying Python traceback in Manager Activity rather than only exit code 1; shared original normal-map images are embedded and validated in every authored FBX Video record without rejecting duplicated references.",
            "Nightly 18 (PR #25): Settings > Integrations separates Ruffle Web (required for live GFX buttons) from optional Ruffle Desktop, with missing/ready status, ruffle.js path selection, bundled auto-discovery and a SHA256-pinned Ruffle Web installer that writes to the user's settings folder without requiring Program Files access.",
            "Nightly 19 (PR #26): Fix Blender 5.2 StructRNA removed after successful FBX export by snapshotting primitive object counts before temporary scene reset and reimport verification.",
            "Nightly 19 (PR #27): Add original source UI_Data menu diagnostics, verified English localization for the inspector, nested exact-build Scaleform font/glyph GFX import resolution, and traceable original Flash button events.",
            "Nightly 19 (PR #27): Preview may invoke source-verified zero-argument openScreen or transitionToMainMenu callbacks without restarting Ruffle. Native CryEngine UI initialization, in-movie localized fonts, and exact native button-to-command parity are not claimed or reproduced.",
            "Nightly 20 (PR #29): Original Stage 2 main-menu initial text is localized in a temporary Flash preview; verified nested GFX imports and original Patch Notes dismissal are restored. Dynamic native-host menu state and Scaleform rendering effects still require runtime parity checks.",
            "Nightly 20 (PR #30): FBX exports organize original character components beneath a named hierarchy, preserve source-authored CDF attachment/material labels, and offer optional Combine meshes while protecting UV0, normal-map links, material IDs and incompatible historical armatures.",
            "Nightly 21 (PR #31): Live original GFX preview exposes a source-verified sign-in prompt dismissal callback, identifies an exact unique source build when the original movie matches verified library bytes, and explains missing background/video and unresolved localization instead of presenting a blank view without context.",
            "Nightly 21 (PR #31): Scaleform DDS diagnostics now distinguish absent source atlas tiles, preview safety limits, invalid atlas records, reused or already-defined bitmap IDs, and DDS decoder failures; reports up to 12 missing original DDS virtual paths. This is not full native CryEngine/Scaleform rendering parity.",
            "Nightly 22 (PR #32): The live GFX inspector can open exact-build, source-verified secondary UI_Assets movies (options, ChallengesPopup, custom-match options, credits where present) and return to the original main-menu instance without resetting its ActionScript state. These are manual screen previews, not native menu-command mappings.",
            "Nightly 22 (PR #32): Suppress unwanted Windows console popups for PowerShell-backed export folder/file selection, background Blender FBX exports and FFDec CLI/frame rendering; intentional picker dialogs and explicitly launched FFDec GUI remain visible.",
            "Nightly 23 (PR #34): Resolve original Modded Stage 2 English menu labels using same-build USA-EN_xml.pak CryEngine Strings/Category/String name/value XML; preserve SpreadsheetML support, XML safety constraints and verified source-based lookups.",
            "Nightly 23 (PR #34): Allow source-qualified original locfont and glyph font GFX imports from USA-EN_xml.pak root. Import the unencrypted archive into the Modded Stage 2 Asset Library build; dynamic ActionScript @ui_ assignments and final font binding still require follow-up.",
            "Nightly 25 (PR #35): Correct exact-build English XML discovery by retaining each verified language PAK identity when resolving overlapping text_ui_*.xml member paths, instead of silently skipping ambiguous global paths. Provide explicit diagnostics for missing or ambiguous archive-scoped sources. Reopen the GFX editor and live preview to reload translations; dynamic ActionScript @ui_ replacement is still separate.",
            "Nightly 26 (PR #33): Recover more original GFX bitmap tiles by raising bounded Scaleform preview tile/pixel limits and checking each reconstructed SWF bitmap against the unchanged 32 MiB movie cap. Diagnostics now distinguish bitmap count, pixel budget and reconstructed-SWF byte limit skips.",
            "Nightly 26 (PR #36): Search exact-build, manifest-verified videos.pak for original main_menu.usm across known authored mount layouts, distinguish videos.pak absent from clip missing, and suppress the Windows FFmpeg conversion console. Original video asset plus compatible browser derivative/FFmpeg remain necessary.",
            "Nightly 27 (PR #39): Resolve source-verified MenuModeSelect DDS img:// paths for the original Training/Singleplayer Flash mode cards and stage bounded temporary PNG previews in the Ruffle menu viewport. Supports original options/settings movie previews; requires matching UI_Assets.pak in the chosen source build.",
            "Nightly 27 (PR #40): Rocky 2012 character FBX export tolerates unused bone clusters when Blender omits empty Indexes/Weights arrays, while preserving real weighted clusters and rejecting incomplete weighted data.",
            "Nightly 29 (PR #44; commit 9ee2314): Add cosmetic/gameplay/review mod classification and filters, searchable guided gameplay-value editing with backups, and model shortcuts/editable imported-asset copies. Cosmetic online launching is not yet complete.",
            "Nightly 29 (PR #43): Add user-configured FFmpeg for source-verified Goliath CRI USM preview, bounded original movie menu callbacks, AVM1 literal localization lookup, compressed CWS font inspection, and in-preview asset diagnostics. Original game-service callbacks and exact in-movie localization/rendering still require verification.",
            "Nightly 29 (PR #37): Verify exact-build videos.pak members from the Asset Library inventory, support alternate mount roots for a uniquely identified Goliath USM, and report source video filenames when missing without substituting another background.",
            "Nightly 29 (PR #42): Experimentally recover authored mesh-normal orientation from supported CryEngine tangent-frame streams when a separate original normal stream is absent; valid original normal streams remain preferred. Actual 2012/Stage 2 samples and Blender unrigged FBX normal fidelity still need real-world verification.",
            "Nightly 30 (PR #45): Opening an indexed GFX selects the GFX Tools workspace with actionable source validation and render controls rather than the 3D placeholder. Switching to any normal model, DDS, CDF assembly or another asset returns to the corresponding viewer. Delayed GFX/FFDec/Ruffle completions no longer pin the viewport when another file was selected; newly chosen GFX files are queued while prior operations finish.",
            "Nightly 31 (PR #47): Add bounded preview-only CurrentMenu, NPE and CustomSolo host query values for the original main_menu.gfx Training screen, controlled from the Source UI_Data inspector. Evaluate only recognized source conditions, preserve the original Flash artwork and handlers, and keep native game-service calls disabled. Actual image-card and hover parity still requires verification with the original movie.",
            "Nightly 32 (PR #48): Fix original Training, NPE and Solo image-card selection by returning the original numeric CryEngine CurrentMenu MMS IDs. Earlier preview string values made the Flash image-button condition false even though source DDS cards were loaded. Original Flash assets and hover actions remain unchanged; real Ruffle visual verification is still required.",
            "Nightly 33 (PR #49): Restore original GFX Training mode-card MovieClipLoader artwork by routing the source img:// DDS requests to verified imported MenuModeSelect PNG derivatives in an isolated preview. Preserve original Flash button handlers and hover states. Submenu-video transitions and private-style Asset Library import remain under CI review.",
            "Nightly 36 (PR #53): Asset Library now auto-detects ZIP-compatible legacy Evolve PAKs and imports them using bounded path-safe ZIP extraction with CRC32 checks rather than incorrectly demanding Stage 2 RSA verification. Authenticated signed Twofish CryPAKs still require their matching RSA public keys; unsupported or corrupt archive formats remain rejected. Source files are never modified.",
            "Nightly 35 (PR #52): Rewrite the 24 original MenuModeSelect Flash MovieClipLoader image filenames from .dds to .png in the temporary AVM1 preview, serve verified imported PNG artwork, and report attempted/served/failed image requests in Check preview assets. Original game assets and Flash layout remain unchanged; visual parity still requires verification.",
            "Nightly 34 (PRs #50 and #51): Bring private-style Asset Library imports back with native multi-PAK and recursive whole-folder selection, preview counts, RSA archive validation and cancellable per-archive progress. Add original FrontEndVideoList submenu backgrounds to GFX previews, selecting verified lobby, options and FoundersPopup USMs on menu transitions and restoring the Goliath main-menu video. PR #49 mode-card source loading remains included.",
            "Ruffle Web installation requires the adjacent WASM files and still cannot emulate native CryEngine menu services; original ActionScript actions require runtime verification.",
            "FBX: material-ID preservation from original CryEngine mesh subsets (including sparse IDs and NoDraw), face-count and UV-per-material checks, and safer rig cluster/bind-pose optimization.",
            "FBX: tangent-space normal maps are embedded in FBX regardless of the optional diffuse/other texture embedding switch. Untextured diffuse materials remain neutral white.",
            "Exporter validates original armatures, weights, UV0, material assignments, and normal-map links; original CryEngine native callback/runtime parity still needs verification.",

            "Settings > Integrations detects separate Ruffle Web, Desktop Ruffle and FFDec runtimes or offers explicit verified installation; installer adds optional preselected GFX tools. FFDec may require Java. Portable ZIP excludes bundled third-party tools.",
            "Stage 2 monster Glow lookup includes exact owning _ts.pak split DDS files (including Kraken/Grounder); 2012 Rocky CDF FBX exporter preserves multiple original 47/48-bone armatures without inventing weights.",
            "Emet CDF model options include authored face attachment selection and Respawn Beacon visibility where present, with options carried into CDF FBX export; original MtlName references are used for authored multi-subset materials.",
            "These experimental features require source assets and some live-game verification. Ruffle cannot recreate CryEngine native Scaleform callbacks.",
            "Portable users remain portable; application updates never modify game files.",
            "Game-exact HDR bloom is not yet reproduced.",
            "Installer options: desktop shortcut, Start Menu shortcut, launch when finished.",
            "Only the Windows installer and portable ZIP are published.",
            ""
          )
          foreach ($item in @($installer, $portable)) {
            $name = Split-Path $item -Leaf
            $digest = (Get-FileHash -Algorithm SHA256 $item).Hash.ToLowerInvariant()
            $body += "SHA256 $name $digest"
          }
          Set-Content -LiteralPath "dist/nightly-release-notes.md" -Value $body -Encoding utf8

      - name: Publish Nightly 0.1.0 GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Evolve Mod Manager Nightly 0.1.0 (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body_path: dist/nightly-release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/EvolveModManager-Setup-${{ env.VERSION }}.exe
            dist/EvolveModManager-Portable-${{ env.VERSION }}.zip
