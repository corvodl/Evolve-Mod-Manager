name: Nightly 0.1.0 Windows release

on:
  # Manual developer trigger remains available in GitHub Actions.
  workflow_dispatch:
  # Connector-safe explicit trigger: update the request file on main to
  # publish a nightly from that exact main commit. No ordinary merges,
  # source-code pushes, PRs or schedules publish releases.
  push:
    branches: [main]
    paths:
      - '.github/nightly-request.txt'

# The source-repository token is read-only. Publishing uses the dedicated
# PUBLIC_RELEASE_TOKEN for the public artifacts repository instead.
permissions:
  contents: read

# Avoid overlapping 20-minute Windows release builds.
concurrency:
  group: evolve-nightly-windows
  # A newer manual build supersedes an older manual build.
  cancel-in-progress: true

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      VERSION: 0.1.0-nightly.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public release repository and credentials
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TARGET_REPO: corvodl/Evolve-Mod-Manager
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'PUBLIC_RELEASE_TOKEN is not set. Configure a fine-grained token with Contents: write on corvodl/Evolve-Mod-Manager and store it as an Actions secret in this private repository.'
          }
          $repoJson = gh api "repos/$env:TARGET_REPO"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($repoJson)) {
            throw "PUBLIC_RELEASE_TOKEN cannot access the release target $env:TARGET_REPO."
          }
          $repo = $repoJson | ConvertFrom-Json
          if ($repo.private) {
            throw "Release target $env:TARGET_REPO must be the public artifact repository."
          }
          if ($repo.default_branch -ne 'main') {
            throw "Release target $env:TARGET_REPO must keep main as its default branch."
          }
          $files = @(gh api "repos/$env:TARGET_REPO/contents" --jq '.[].name')
          if ($LASTEXITCODE -ne 0 -or
              @(Compare-Object @('LICENSE', 'README.md') $files).Count -ne 0) {
            throw "Public main must contain only README.md and LICENSE before creating a release tag."
          }
          # The previous nightly release is the changelog boundary. Tags exist
          # only in the public artifact repository, so compare against its
          # publication time rather than source-repository tags.
          $releasesJson = gh release list --repo $env:TARGET_REPO --limit 100 --json tagName,createdAt
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list existing nightly releases in $env:TARGET_REPO."
          }
          $releases = $releasesJson | ConvertFrom-Json
          $previous = $releases |
            Where-Object { $_.tagName -match '^v0\.1\.0-nightly\.[0-9]+$' } |
            Sort-Object { [int]($_.tagName -replace '^v0\.1\.0-nightly\.', '') } -Descending |
            Select-Object -First 1
          "NIGHTLY_BASELINE_TAG=$($previous.tagName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NIGHTLY_BASELINE_AT=$($previous.createdAt)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Publishing to public $env:TARGET_REPO from its main branch."

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Stamp monotonically increasing Nightly prerelease version
        shell: pwsh
        run: |
          $manifest = Get-Content "Cargo.toml" -Raw
          $original = 'version = "0.1.0"'
          if (!$manifest.Contains($original)) {
            throw "Expected Nightly 0.1.0 base version in workspace Cargo.toml"
          }
          $manifest = $manifest.Replace($original, ('version = "' + $env:VERSION + '"'))
          Set-Content "Cargo.toml" -Value $manifest -Encoding utf8
          Write-Host "Building Nightly $env:VERSION"

      # Core and desktop lint/tests run in CI; compile binaries only once here.
      - run: cargo fmt --all -- --check
      - run: cargo build --release --workspace --bins

      # Packaging must never ship an accidental asInvoker/test build.
      - name: Verify release executable requires administrator
        shell: pwsh
        run: |
          $binaryPath = Join-Path "target/release" "evolve-mod-manager.exe"
          if (!(Test-Path -LiteralPath $binaryPath)) {
            throw "Missing release executable: $binaryPath"
          }
          $binary = (Resolve-Path -LiteralPath $binaryPath).Path
          $mtCommand = Get-Command mt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $mtPath = if ($mtCommand) { $mtCommand.Source } else { $null }
          if (!$mtPath) {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $mtPath = Get-ChildItem -Path $sdkBin -Filter mt.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$mtPath) { throw 'mt.exe is required to inspect the executable manifest.' }
          $manifest = Join-Path $env:RUNNER_TEMP 'evolve-mod-manager.manifest'
          Remove-Item -LiteralPath $manifest -ErrorAction SilentlyContinue
          & $mtPath -nologo -inputresource:"$binary;#1" -out:"$manifest"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $manifest)) {
            throw 'Unable to extract the embedded manifest from evolve-mod-manager.exe.'
          }
          try {
            [xml]$xml = Get-Content -LiteralPath $manifest -Raw
          } catch {
            throw "Embedded manifest is not valid XML: $($_.Exception.Message)"
          }
          $levels = @($xml.SelectNodes('//*[local-name()="requestedExecutionLevel"]'))
          if ($levels.Count -ne 1) {
            throw "Embedded manifest must contain exactly one requestedExecutionLevel; found $($levels.Count)."
          }
          $level = "$($levels[0].level)".Trim()
          if ($level -ne 'requireAdministrator') {
            throw "evolve-mod-manager.exe must require administrator; found level '$level'."
          }
          Write-Host 'evolve-mod-manager.exe manifest requires administrator.'

      - name: Retrieve and verify developer-supplied Stage 2 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.EVOLVE_STAGE2_TOOLS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Set EVOLVE_STAGE2_TOOLS_TOKEN with Contents:read on corvodl/Evolve-Official-Tools.'
          }
          $sourceRepo = 'corvodl/Evolve-Official-Tools'
          $folder = Join-Path $env:RUNNER_TEMP 'evolve-official-tools'
          if (Test-Path -LiteralPath $folder) { Remove-Item -LiteralPath $folder -Recurse -Force }
          & gh repo clone $sourceRepo $folder -- --depth 1 --filter=blob:none
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch authorized private tool repository.' }
          ./scripts/package-official-stage2-tools.ps1 -SourceDirectory (Join-Path $folder 'evolve_tool_stage2')
          # Remove source trees and original signing materials after extracting
          # only the verified redistributable runtime components.
          Remove-Item -LiteralPath $folder -Recurse -Force

      - name: Stage verified GPLv2 Cryengine-Converter and corresponding source
        shell: pwsh
        run: ./scripts/prepare-cryengine-converter.ps1 -Fetch

      - name: Create portable ZIP (both Windows executables)
        shell: pwsh
        run: |
          $folder = "dist/EvolveModManager-Portable"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          foreach ($name in @("evolve-mod-manager.exe", "evolve-cli.exe", "evolve-teleport-overlay.exe", "evolve-privileged-worker.exe")) {
            $source = Join-Path "target/release" $name
            if (!(Test-Path $source)) { throw "Windows executable missing: $name" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $folder $name)
          }
          Copy-Item -LiteralPath "assets/hunt.ico" -Destination "$folder/hunt.ico"
          $banner = "assets/default_loading.dds"
          $expectedHash = "2f02f19b085dc7edc5f88b730121ca511bf499b2c3ef1045f4ebe020da3fff5a"
          if (!(Test-Path -LiteralPath $banner)) { throw "Required Home banner asset missing: $banner" }
          $actualHash = (Get-FileHash -LiteralPath $banner -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Home banner asset SHA256 does not match the verified original DDS" }
          $assetDir = Join-Path $folder "assets"
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          Copy-Item -LiteralPath $banner -Destination (Join-Path $assetDir "default_loading.dds")
          Copy-Item -LiteralPath "README.md" -Destination "$folder/README.md"
          New-Item -ItemType Directory -Path "$folder/third_party" -Force | Out-Null
          Copy-Item -LiteralPath "dist/third_party/OfficialStage2" -Destination "$folder/third_party/OfficialStage2" -Recurse -Force
          if (Test-Path -LiteralPath 'dist/third_party/Cryengine-Converter') {
            Copy-Item -LiteralPath 'dist/third_party/Cryengine-Converter' -Destination "$folder/third_party/Cryengine-Converter" -Recurse -Force
          }
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath "dist/EvolveModManager-Portable-$env:VERSION.zip" -CompressionLevel Optimal -Force

      - name: Fetch and verify optional GFX editor tools
        shell: pwsh
        run: ./scripts/package-gfx-tools.ps1

      - name: Fetch and verify optional Audio Tools
        shell: pwsh
        run: ./scripts/package-audio-tools.ps1

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup compiler" }
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing: $compiler" }
          & $compiler "/DAppVersion=$env:VERSION" "installer/EvolveModManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed" }

      - name: Verify installer and portable ZIP, prepare SHA256 release notes
        shell: pwsh
        run: |
          $installer = "dist/EvolveModManager-Setup-$env:VERSION.exe"
          $portable = "dist/EvolveModManager-Portable-$env:VERSION.zip"
          foreach ($item in @($installer, $portable)) {
            if (!(Test-Path $item)) { throw "Missing Nightly release asset: $item" }
            if ((Get-Item $item).Length -lt 1024) { throw "Suspiciously small Nightly asset: $item" }
          }
          # Require the complete official runtime in every portable release.
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $portable).Path)
          try {
            foreach ($name in @(
              'third_party/OfficialStage2/evolve_tool.exe',
              'third_party/OfficialStage2/crypto.dll',
              'third_party/OfficialStage2/inject/inject.dll',
              'third_party/OfficialStage2/inject/dbghelp.dll',
              'third_party/OfficialStage2/inject/RSAKeyData.bin',
              'third_party/OfficialStage2/README.txt',
              'third_party/OfficialStage2/LICENSE-BOUNCYCASTLE.html'
            )) {
              $entry = $archive.GetEntry($name)
              if ($null -eq $entry -or $entry.Length -le 0) {
                throw "Portable release is missing official tool component: $name"
              }
            }
          } finally { $archive.Dispose() }
          Write-Host 'Portable official tool inventory verified.'
          # The previous published nightly is the changelog boundary. Tags live
          # only in the public artifact repository, which points at its
          # README/LICENSE-only main, so list first-parent source commits newer
          # than that release and never carry old release notes forward.
          $previousTag = $env:NIGHTLY_BASELINE_TAG
          $previousAt = $env:NIGHTLY_BASELINE_AT
          if (!$previousTag -or !$previousAt) {
            $previousTag = $null
            $previousAt = $null
          }

          $body = @(
            "Evolve Mod Manager Nightly 0.1.0 (build $env:VERSION)",
            "",
            "Experimental Windows preview. The manager is not yet feature-complete.",
            ""
          )
          $changes = @()
          if ($previousTag) {
            $body += "Changes since ${previousTag}:"
            $history = @(git log --first-parent --format="%H" --since="$previousAt" HEAD)
            if ($LASTEXITCODE -ne 0) { throw "Unable to compare commits since $previousTag" }
            foreach ($commit in $history) {
              if (!$commit) { continue }
              $lines = @(git log -1 --format="%B" $commit |
                Where-Object { ![string]::IsNullOrWhiteSpace($_) })
              if ($LASTEXITCODE -ne 0) { throw "Unable to read commit $commit" }
              if ($lines.Count -eq 0) { continue }
              $subject = $lines[0].Trim()
              # Release publishing metadata is not an application change.
              if ($subject -match '^build\(nightly\):') { continue }
              if ($subject -match '^Merge pull request #([0-9]+)\b') {
                $number = $Matches[1]
                $title = if ($lines.Count -gt 1) { $lines[1].Trim() } else { $subject }
                $changes += "- PR #${number}: $title"
              } else {
                $changes += "- $subject"
              }
            }
          } else {
            $body += "Initial Nightly release on the public release channel."
          }
          if ($changes.Count -gt 0) {
            $body += $changes
          } elseif ($previousTag) {
            $body += "- No code changes since the previous published Nightly (scheduled rebuild)."
          }
          $body += ""
          foreach ($item in @($installer, $portable)) {
            $name = Split-Path $item -Leaf
            $digest = (Get-FileHash -Algorithm SHA256 $item).Hash.ToLowerInvariant()
            $body += "SHA256 $name $digest"
          }
          Set-Content -LiteralPath "dist/nightly-release-notes.md" -Value $body -Encoding utf8

      # Publish only build artifacts to the public repository. The tag is
      # created from the public README/LICENSE-only main, so GitHub's generated
      # source archives contain no source; never upload source archives.
      - name: Publish Nightly 0.1.0 GitHub prerelease to public repository
        uses: softprops/action-gh-release@v3
        with:
          repository: corvodl/Evolve-Mod-Manager
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          target_commitish: main
          tag_name: v${{ env.VERSION }}
          name: Evolve Mod Manager Nightly 0.1.0 (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body_path: dist/nightly-release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/EvolveModManager-Setup-${{ env.VERSION }}.exe
            dist/EvolveModManager-Portable-${{ env.VERSION }}.zip
