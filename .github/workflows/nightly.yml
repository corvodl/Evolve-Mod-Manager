name: Nightly 0.1.0 Windows release

on:
  # Manual developer trigger remains available in GitHub Actions.
  workflow_dispatch:
  # Connector-safe explicit trigger: update the request file on main to
  # publish a nightly from that exact main commit. No ordinary merges,
  # source-code pushes, PRs or schedules publish releases.
  push:
    branches: [main]
    paths:
      - '.github/nightly-request.txt'

permissions:
  contents: write

# Avoid overlapping 20-minute Windows release builds.
concurrency:
  group: evolve-nightly-windows
  # A newer manual build supersedes an older manual build.
  cancel-in-progress: true

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      VERSION: 0.1.0-nightly.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Stamp monotonically increasing Nightly prerelease version
        shell: pwsh
        run: |
          $manifest = Get-Content "Cargo.toml" -Raw
          $original = 'version = "0.1.0"'
          if (!$manifest.Contains($original)) {
            throw "Expected Nightly 0.1.0 base version in workspace Cargo.toml"
          }
          $manifest = $manifest.Replace($original, ('version = "' + $env:VERSION + '"'))
          Set-Content "Cargo.toml" -Value $manifest -Encoding utf8
          Write-Host "Building Nightly $env:VERSION"

      # Core and desktop lint/tests run in CI; compile binaries only once here.
      - run: cargo fmt --all -- --check
      - run: cargo build --release --workspace --bins

      - name: Retrieve and verify developer-supplied Stage 2 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.EVOLVE_STAGE2_TOOLS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Set EVOLVE_STAGE2_TOOLS_TOKEN with Contents:read on corvodl/Evolve-Official-Tools.'
          }
          $sourceRepo = 'corvodl/Evolve-Official-Tools'
          $folder = Join-Path $env:RUNNER_TEMP 'evolve-official-tools'
          if (Test-Path -LiteralPath $folder) { Remove-Item -LiteralPath $folder -Recurse -Force }
          & gh repo clone $sourceRepo $folder -- --depth 1 --filter=blob:none
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch authorized private tool repository.' }
          ./scripts/package-official-stage2-tools.ps1 -SourceDirectory (Join-Path $folder 'evolve_tool_stage2')
          # Remove source trees and original signing materials after extracting
          # only the verified redistributable runtime components.
          Remove-Item -LiteralPath $folder -Recurse -Force

      - name: Create portable ZIP (both Windows executables)
        shell: pwsh
        run: |
          $folder = "dist/EvolveModManager-Portable"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          foreach ($name in @("evolve-mod-manager.exe", "evolve-cli.exe", "evolve-teleport-overlay.exe")) {
            $source = Join-Path "target/release" $name
            if (!(Test-Path $source)) { throw "Windows executable missing: $name" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $folder $name)
          }
          Copy-Item -LiteralPath "assets/hunt.ico" -Destination "$folder/hunt.ico"
          $banner = "assets/default_loading.dds"
          $expectedHash = "2f02f19b085dc7edc5f88b730121ca511bf499b2c3ef1045f4ebe020da3fff5a"
          if (!(Test-Path -LiteralPath $banner)) { throw "Required Home banner asset missing: $banner" }
          $actualHash = (Get-FileHash -LiteralPath $banner -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Home banner asset SHA256 does not match the verified original DDS" }
          $assetDir = Join-Path $folder "assets"
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          Copy-Item -LiteralPath $banner -Destination (Join-Path $assetDir "default_loading.dds")
          Copy-Item -LiteralPath "README.md" -Destination "$folder/README.md"
          New-Item -ItemType Directory -Path "$folder/third_party" -Force | Out-Null
          Copy-Item -LiteralPath "dist/third_party/OfficialStage2" -Destination "$folder/third_party/OfficialStage2" -Recurse -Force
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath "dist/EvolveModManager-Portable-$env:VERSION.zip" -CompressionLevel Optimal -Force

      - name: Fetch and verify optional GFX editor tools
        shell: pwsh
        run: ./scripts/package-gfx-tools.ps1

      - name: Fetch and verify optional Audio Tools
        shell: pwsh
        run: ./scripts/package-audio-tools.ps1

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup compiler" }
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing: $compiler" }
          & $compiler "/DAppVersion=$env:VERSION" "installer/EvolveModManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed" }

      - name: Verify installer and portable ZIP, prepare SHA256 release notes
        shell: pwsh
        run: |
          $installer = "dist/EvolveModManager-Setup-$env:VERSION.exe"
          $portable = "dist/EvolveModManager-Portable-$env:VERSION.zip"
          foreach ($item in @($installer, $portable)) {
            if (!(Test-Path $item)) { throw "Missing Nightly release asset: $item" }
            if ((Get-Item $item).Length -lt 1024) { throw "Suspiciously small Nightly asset: $item" }
          }
          # Require the complete official runtime in every portable release.
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $portable).Path)
          try {
            foreach ($name in @(
              'third_party/OfficialStage2/evolve_tool.exe',
              'third_party/OfficialStage2/crypto.dll',
              'third_party/OfficialStage2/inject/inject.dll',
              'third_party/OfficialStage2/inject/dbghelp.dll',
              'third_party/OfficialStage2/inject/RSAKeyData.bin',
              'third_party/OfficialStage2/README.txt',
              'third_party/OfficialStage2/LICENSE-BOUNCYCASTLE.html'
            )) {
              $entry = $archive.GetEntry($name)
              if ($null -eq $entry -or $entry.Length -le 0) {
                throw "Portable release is missing official tool component: $name"
              }
            }
          } finally { $archive.Dispose() }
          Write-Host 'Portable official tool inventory verified.'
          # The previous published nightly is the changelog boundary.
          # Pull complete history/tags at checkout and list first-parent
          # merges/direct commits only; never carry old release notes forward.
          $previousTag = git tag --merged HEAD --list 'v0.1.0-nightly.*' |
            Where-Object { $_ -match '^v0\.1\.0-nightly\.[0-9]+$' } |
            Sort-Object { [int]($_ -replace '^v0\.1\.0-nightly\.', '') } -Descending |
            Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect previous nightly tags" }

          $body = @(
            "Evolve Mod Manager Nightly 0.1.0 (build $env:VERSION)",
            "",
            "Experimental Windows preview. The manager is not yet feature-complete.",
            ""
          )
          $changes = @()
          if ($previousTag) {
            $body += "Changes since ${previousTag}:"
            $history = @(git log --first-parent --format="%H" "$previousTag..HEAD")
            if ($LASTEXITCODE -ne 0) { throw "Unable to compare commits with $previousTag" }
            foreach ($commit in $history) {
              if (!$commit) { continue }
              $lines = @(git log -1 --format="%B" $commit |
                Where-Object { ![string]::IsNullOrWhiteSpace($_) })
              if ($LASTEXITCODE -ne 0) { throw "Unable to read commit $commit" }
              if ($lines.Count -eq 0) { continue }
              $subject = $lines[0].Trim()
              # Release publishing metadata is not an application change.
              if ($subject -match '^build\(nightly\):') { continue }
              if ($subject -match '^Merge pull request #([0-9]+)\b') {
                $number = $Matches[1]
                $title = if ($lines.Count -gt 1) { $lines[1].Trim() } else { $subject }
                $changes += "- PR #${number}: $title"
              } else {
                $changes += "- $subject"
              }
            }
          } else {
            $body += "Initial Nightly release on this branch."
          }
          if ($changes.Count -gt 0) {
            $body += $changes
          } elseif ($previousTag) {
            $body += "- No code changes since the previous published Nightly (scheduled rebuild)."
          }
          $body += ""
          foreach ($item in @($installer, $portable)) {
            $name = Split-Path $item -Leaf
            $digest = (Get-FileHash -Algorithm SHA256 $item).Hash.ToLowerInvariant()
            $body += "SHA256 $name $digest"
          }
          Set-Content -LiteralPath "dist/nightly-release-notes.md" -Value $body -Encoding utf8

      - name: Publish Nightly 0.1.0 GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Evolve Mod Manager Nightly 0.1.0 (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body_path: dist/nightly-release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/EvolveModManager-Setup-${{ env.VERSION }}.exe
            dist/EvolveModManager-Portable-${{ env.VERSION }}.zip
