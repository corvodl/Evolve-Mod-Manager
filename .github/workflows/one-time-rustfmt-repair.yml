name: One-time merge rustfmt repair
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'ci: request one-time rustfmt repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source and open a repair branch
        shell: bash
        env:
          REPAIR_BRANCH: ci/merge-rustfmt-repair
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --stat
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$REPAIR_BRANCH"
          git add -u
          git commit -m "style: format merged Rust source"
          git push origin "HEAD:refs/heads/$REPAIR_BRANCH"
