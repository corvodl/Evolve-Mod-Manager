name: Temporary online firewall formatter
on:
  push:
    branches: [fix/developer-online-firewall-override]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/developer-online-firewall-override
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format final online firewall feature
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/evolve-desktop/src/online_guard.rs
            git add crates/evolve-desktop/src/main.rs
            git add crates/evolve-desktop/src/mod_play.rs
            git add crates/evolve-desktop/src/play_setup.rs
            git add crates/evolve-desktop/src/private_pages.rs
            git commit -m "style: format final online firewall feature"
            git push origin HEAD:fix/developer-online-firewall-override
          fi
