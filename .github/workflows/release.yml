name: Publish Windows installer and portable ZIP
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver matching the desktop Cargo package"
        required: true
        type: string
      parity_confirm:
        description: "Type PARITY_VERIFIED_AND_TESTED after real-game checks"
        required: true
        type: string

# The source-repository token is read-only. Publishing uses the dedicated
# PUBLIC_RELEASE_TOKEN for the public artifacts repository instead.
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prevent premature or mismatched releases
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          APPROVAL: ${{ inputs.parity_confirm }}
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Production releases must run from main."
          }
          if ($env:APPROVAL -ne "PARITY_VERIFIED_AND_TESTED") {
            throw "The real-game feature-parity acceptance gate has not been approved."
          }
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-(?:beta|rc)\.[0-9]+)?$') {
            throw "Invalid release version."
          }
          $meta = cargo metadata --no-deps --format-version=1 | ConvertFrom-Json
          $package = $meta.packages | Where-Object { $_.name -eq "evolve-mod-manager" }
          if (!$package -or $package.version -ne $env:VERSION) {
            throw "Version must match the desktop Cargo package."
          }
          # Require every acceptance row to be independently marked verified.
          # A status such as **Partial: ...** must NOT slip past a bare
          # **Partial** string match.
          $rows = @()
          $inside = $false
          foreach ($line in (Get-Content -LiteralPath "docs/PARITY.md")) {
            if ($line -match '^\| Feature \| Rust rewrite status \|') {
              $inside = $true
              continue
            }
            if ($inside -and $line -notmatch '^\|') { break }
            if ($inside -and $line -match '^\| ' -and $line -notmatch '^\| ---') {
              $rows += $line
            }
          }
          if ($rows.Count -lt 15) {
            throw "Feature parity checklist missing or unexpectedly short."
          }
          foreach ($row in $rows) {
            $fields = $row.Split('|')
            if ($fields.Count -lt 5 -or $fields[2] -notmatch '\*\*Verified for v1\.0\*\*') {
              throw "Release blocked by unverified feature: $row"
            }
          }

      # Run only after the source/version/parity gate passes so a rejected
      # run never touches the public release token.
      - name: Verify public release repository and credentials
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TARGET_REPO: corvodl/Evolve-Mod-Manager
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'PUBLIC_RELEASE_TOKEN is not set. Configure a fine-grained token with Contents: write on corvodl/Evolve-Mod-Manager and store it as an Actions secret in this private repository.'
          }
          $repoJson = gh api "repos/$env:TARGET_REPO"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($repoJson)) {
            throw "PUBLIC_RELEASE_TOKEN cannot access the release target $env:TARGET_REPO."
          }
          $repo = $repoJson | ConvertFrom-Json
          if ($repo.private) {
            throw "Release target $env:TARGET_REPO must be the public artifact repository."
          }
          if ($repo.default_branch -ne 'main') {
            throw "Release target $env:TARGET_REPO must keep main as its default branch."
          }
          $files = @(gh api "repos/$env:TARGET_REPO/contents" --jq '.[].name')
          if ($LASTEXITCODE -ne 0 -or
              @(Compare-Object @('LICENSE', 'README.md') $files).Count -ne 0) {
            throw "Public main must contain only README.md and LICENSE before creating a release tag."
          }
          Write-Host "Publishing to public $env:TARGET_REPO from its main branch."

      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --release --workspace --bins

      # Packaging must never ship an accidental asInvoker/test build.
      - name: Verify release executable requires administrator
        shell: pwsh
        run: |
          $binaryPath = Join-Path "target/release" "evolve-mod-manager.exe"
          if (!(Test-Path -LiteralPath $binaryPath)) {
            throw "Missing release executable: $binaryPath"
          }
          $binary = (Resolve-Path -LiteralPath $binaryPath).Path
          $mtCommand = Get-Command mt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $mtPath = if ($mtCommand) { $mtCommand.Source } else { $null }
          if (!$mtPath) {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $mtPath = Get-ChildItem -Path $sdkBin -Filter mt.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$mtPath) { throw 'mt.exe is required to inspect the executable manifest.' }
          $manifest = Join-Path $env:RUNNER_TEMP 'evolve-mod-manager.manifest'
          Remove-Item -LiteralPath $manifest -ErrorAction SilentlyContinue
          & $mtPath -nologo -inputresource:"$binary;#1" -out:"$manifest"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $manifest)) {
            throw 'Unable to extract the embedded manifest from evolve-mod-manager.exe.'
          }
          try {
            [xml]$xml = Get-Content -LiteralPath $manifest -Raw
          } catch {
            throw "Embedded manifest is not valid XML: $($_.Exception.Message)"
          }
          $levels = @($xml.SelectNodes('//*[local-name()="requestedExecutionLevel"]'))
          if ($levels.Count -ne 1) {
            throw "Embedded manifest must contain exactly one requestedExecutionLevel; found $($levels.Count)."
          }
          $level = "$($levels[0].level)".Trim()
          if ($level -ne 'requireAdministrator') {
            throw "evolve-mod-manager.exe must require administrator; found level '$level'."
          }
          Write-Host 'evolve-mod-manager.exe manifest requires administrator.'

      - name: Retrieve and verify developer-supplied Stage 2 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.EVOLVE_STAGE2_TOOLS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Set EVOLVE_STAGE2_TOOLS_TOKEN with Contents:read on corvodl/Evolve-Official-Tools.'
          }
          $sourceRepo = 'corvodl/Evolve-Official-Tools'
          $folder = Join-Path $env:RUNNER_TEMP 'evolve-official-tools'
          if (Test-Path -LiteralPath $folder) { Remove-Item -LiteralPath $folder -Recurse -Force }
          & gh repo clone $sourceRepo $folder -- --depth 1 --filter=blob:none
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch authorized private tool repository.' }
          ./scripts/package-official-stage2-tools.ps1 -SourceDirectory (Join-Path $folder 'evolve_tool_stage2')
          Remove-Item -LiteralPath $folder -Recurse -Force

      - name: Stage verified GPLv2 Cryengine-Converter and corresponding source
        shell: pwsh
        run: ./scripts/prepare-cryengine-converter.ps1 -Fetch

      - name: Package portable Windows distribution
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $folder = "dist/EvolveModManager-Portable"
          New-Item -ItemType Directory -Force $folder | Out-Null
          foreach ($name in @("evolve-mod-manager.exe", "evolve-cli.exe", "evolve-privileged-worker.exe")) {
            $source = Join-Path "target/release" $name
            if (!(Test-Path $source)) { throw "Windows binary missing: $name" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $folder $name)
          }
          Copy-Item -LiteralPath 'assets/hunt.ico' -Destination "$folder/hunt.ico"
          $banner = 'assets/default_loading.dds'
          $expectedHash = '2f02f19b085dc7edc5f88b730121ca511bf499b2c3ef1045f4ebe020da3fff5a'
          if (!(Test-Path -LiteralPath $banner) -or (Get-FileHash -LiteralPath $banner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'Required Home banner does not match the verified original DDS.'
          }
          New-Item -ItemType Directory -Path "$folder/assets" -Force | Out-Null
          Copy-Item -LiteralPath $banner -Destination "$folder/assets/default_loading.dds"
          Copy-Item -LiteralPath 'README.md' -Destination "$folder/README.md"
          New-Item -ItemType Directory -Path "$folder/third_party" -Force | Out-Null
          Copy-Item -LiteralPath 'dist/third_party/OfficialStage2' -Destination "$folder/third_party/OfficialStage2" -Recurse -Force
          Copy-Item -LiteralPath 'dist/third_party/Cryengine-Converter' -Destination "$folder/third_party/Cryengine-Converter" -Recurse -Force
          ./scripts/package-portable-release.ps1 -SourceDirectory $folder -ArchivePath "dist/EvolveModManager-Portable-$env:VERSION.zip"

      - name: Fetch and verify optional GFX editor tools
        shell: pwsh
        run: ./scripts/package-gfx-tools.ps1

      - name: Compile Windows installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing." }
          & $compiler "/DAppVersion=$env:VERSION" "installer/EvolveModManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }

      - name: Check the only two distributable files
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $installer = "dist/EvolveModManager-Setup-$env:VERSION.exe"
          $portable = "dist/EvolveModManager-Portable-$env:VERSION.zip"
          foreach ($item in @($installer, $portable)) {
            if (!(Test-Path $item)) { throw "Missing release file: $item" }
            if ((Get-Item $item).Length -lt 1024) { throw "Suspiciously small file: $item" }
          }
          ./scripts/verify-portable-release.ps1 -ArchivePath $portable
          $body = @("Evolve Mod Manager $env:VERSION",
                    "Windows installer and portable ZIP only.",
                    "")
          foreach ($item in @($installer, $portable)) {
            $name = Split-Path $item -Leaf
            $hash = (Get-FileHash -Algorithm SHA256 $item).Hash.ToLowerInvariant()
            $body += "SHA256 $name $hash"
          }
          Set-Content -LiteralPath "dist/release-notes.md" -Value $body -Encoding utf8

      # Publish only build artifacts to the public repository. The tag is
      # created from the public README/LICENSE-only main, so GitHub's generated
      # source archives contain no source; never upload source archives.
      - name: Publish installer and portable ZIP to public repository
        uses: softprops/action-gh-release@v3
        with:
          repository: corvodl/Evolve-Mod-Manager
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          target_commitish: main
          tag_name: v${{ inputs.version }}
          name: Evolve Mod Manager v${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, '-beta.') || contains(inputs.version, '-rc.') }}
          make_latest: ${{ !contains(inputs.version, '-') }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/EvolveModManager-Setup-${{ inputs.version }}.exe
            dist/EvolveModManager-Portable-${{ inputs.version }}.zip
