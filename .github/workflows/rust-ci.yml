name: Rust core and Windows desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded development commits should not consume additional Windows runners
# while newer model-viewer fixes are already ready to validate.
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate isolated Ruffle Web control and source menu scripts
        run: node --check crates/evolve-desktop/src/gfx_live_player.js
      - name: Verify original GFX hover input routes over background video
        run: node --test crates/evolve-desktop/tests/gfx_preview_input.test.mjs
      - name: Verify original Training menu preview-only host state
        run: node --test crates/evolve-desktop/tests/gfx_preview_runtime.test.cjs
      - name: Verify ordinary C:/ swap journal and legacy rekey path parity
        run: python3 -m unittest discover -s crates/evolve-desktop/launcher_support -p 'test_ordinary_swap_paths.py'
      - name: Verify Test B Win32 / extended-path hook matching (Python)
        run: python3 -m unittest discover -s crates/evolve-desktop/launcher_support -p 'test_launch_path_matching.py'
      - name: Verify Frida CreateProcessW path matching (JavaScript)
        run: node --test crates/evolve-desktop/tests/launcher_path_matching.test.cjs
      - name: Verify guarded original game backup restoration
        run: python3 -m unittest discover -s crates/evolve-desktop/launcher_support -p 'test_reusable_restore.py'
      - name: Verify journal-independent private manager backup recovery
        run: python3 -m unittest discover -s crates/evolve-desktop/launcher_support -p 'test_orphaned_swap_recovery.py'
      - name: Validate bundled Blender converter syntax
        run: python3 -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in pathlib.Path('crates/evolve-core/src').glob('blender_*.py')]"
      - name: Validate source-faithful UV seam/tile regressions
        run: python3 -m unittest discover -s crates/evolve-core/tests -p 'test_blender_uv0.py'
      - name: Validate external FBX normal-map and rig regression tests
        run: python3 -m unittest discover -s crates/evolve-core/tests -p 'test_blender_fbx_safety.py'
      - name: Validate original material-ID and face-assignment parity
        run: python3 -m unittest discover -s crates/evolve-core/tests -p 'test_blender_material_ids.py'
      - name: Validate authored character hierarchy and mesh labels
        run: python3 -m unittest discover -s crates/evolve-core/tests -p 'test_blender_export_hierarchy.py'
      - name: Validate static unrigged FBX world-axis parity
        run: python3 -m unittest discover -s crates/evolve-core/tests -p 'test_blender_static_fbx_basis.py'
      - name: Validate original 2012 Rocky 47/48-bone armature compatibility
        run: python3 -m unittest discover -s crates/evolve-core/tests -p 'test_2012_rocky_armatures.py'
      - name: Test sanitized read-only Discord feed
        run: python3 -m unittest discover -s scripts -p 'test_publish_discord_announcements.py'
      - run: cargo fmt --all -- --check
      - run: cargo test -p evolve-core --all-targets
      - run: cargo clippy -p evolve-core --all-targets -- -D warnings

  desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  portable-preview:
    name: Windows portable preview (not a release)
    needs: [core, desktop]
    runs-on: windows-2022
    timeout-minutes: 55
    # Release-mode binaries are built by Nightly; avoid rebuilding them on every PR.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build actual Windows executables
        run: cargo build --release --workspace --bins
      - name: Verify Windows GUI administrator manifest
        shell: pwsh
        run: |
          $kit = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
          $mt = Get-ChildItem -Path $kit -Recurse -Filter mt.exe -File |
            Where-Object { $_.DirectoryName.EndsWith('\x64') } | Select-Object -First 1
          if (!$mt) { throw 'Windows SDK manifest tool not found' }
          $exe = (Resolve-Path 'target/release/evolve-mod-manager.exe').Path
          $destination = Join-Path $env:RUNNER_TEMP 'evolve-gui.manifest'
          & $mt.FullName "-inputresource:${exe};#1" "-out:${destination}"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $destination)) { throw 'Missing GUI manifest' }
          $manifest = Get-Content -LiteralPath $destination -Raw
          if (!$manifest.Contains('level="requireAdministrator"')) { throw 'GUI must request UAC' }
          if (!$manifest.Contains('uiAccess="false"')) { throw 'GUI must not enable UIAccess' }
      - name: Package development preview without game assets
        shell: pwsh
        run: |
          $output = "dist/EvolveModManager-Rust-Preview"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          foreach ($binary in @("evolve-mod-manager.exe", "evolve-cli.exe")) {
            $source = Join-Path "target/release" $binary
            if (!(Test-Path $source)) { throw "Missing required binary: $binary" }
            Copy-Item $source (Join-Path $output $binary)
          }
          Copy-Item README.md (Join-Path $output "README.md")
          Copy-Item docs/PARITY.md (Join-Path $output "PARITY.md")
          Compress-Archive -LiteralPath $output -DestinationPath "dist/EvolveModManager-Rust-Preview.zip" -CompressionLevel Optimal -Force
          if (!(Test-Path "dist/EvolveModManager-Rust-Preview.zip")) { throw "Missing portable preview" }
      - name: Capture genuine Iced application screenshot (if interactive desktop exists)
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/capture-window.ps1 -Executable "target/release/evolve-mod-manager.exe" -Output "dist/EvolveModManager-Rust-Window.png"
      - name: Upload genuine screenshot separately (if captured)
        uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-Rust-Actual-Window
          path: dist/EvolveModManager-Rust-Window.png
          if-no-files-found: warn
      - name: Upload portable preview (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-Rust-Preview-Windows
          path: dist/EvolveModManager-Rust-Preview.zip
          if-no-files-found: error
