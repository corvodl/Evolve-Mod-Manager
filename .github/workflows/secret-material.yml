name: Protect signing credentials

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for private keys and official tool bundles
        run: python3 scripts/check-secret-material.py
      - name: Verify swap and recovery script syntax
        run: python3 -m py_compile crates/evolve-desktop/launcher_support/{controlled_swap,reusable_restore,orphaned_swap_recovery,auto_restore_watch,auto_launch_frida}.py
