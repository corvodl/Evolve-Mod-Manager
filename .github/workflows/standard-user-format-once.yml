name: Temporary standard-user launcher rustfmt
on:
  push:
    branches: [fix/standard-user-evolve-launch]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/standard-user-evolve-launch
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Rust formatting
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/evolve-desktop/src/standard_user_launch.rs
            git add crates/evolve-desktop/src/main.rs
            git add crates/evolve-desktop/src/play_setup.rs
            git add crates/evolve-desktop/src/private_pages.rs
            git commit -m "style: format process token and privilege diagnostics"
            git push origin HEAD:fix/standard-user-evolve-launch
          fi
