name: Temporary Modding rustfmt
on:
  push:
    branches: [feat/modding-asset-replace-browser-png-dds]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format source in this PR branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: rustfmt mod import flow"
          git push origin HEAD:refs/heads/feat/modding-asset-replace-browser-png-dds
