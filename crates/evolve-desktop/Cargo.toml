[package]
name = "evolve-mod-manager"
description = "Evolve Mod Manager desktop rewrite foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
evolve-core = { path = "../evolve-core" }
iced = { version = "0.14", features = ["wgpu", "tokio", "canvas", "svg", "image"] }
# Explicitly match iced_wgpu 0.14's GPU API generation.
wgpu = "27.0"
tokio = { version = "1", features = ["rt"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
sha2 = "0.10"
crc32fast = "1"
zip = { version = "=2.4.1", default-features = false, features = ["deflate"] }
argon2 = "0.5"
read-process-memory = "0.1"
zeroize = "1"
fs2 = "0.4"
rsa = { version = "0.9", features = ["pem"] }
flate2 = "1"
quick-xml = "0.38"

[build-dependencies]
winres = "0.1"

[lints]
workspace = true

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }
