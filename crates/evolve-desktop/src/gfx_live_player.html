<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolve GFX — live ActionScript preview</title>
<style>
:root { color-scheme:dark; font:14px system-ui, sans-serif; background:#111318; color:#e7e8ed; }
* { box-sizing:border-box; }
body { margin:0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { padding:10px 14px; background:#202329; border-bottom:1px solid #353940; display:flex; align-items:center; justify-content:space-between; gap:15px; }
strong { color:#f35a5e; letter-spacing:.04em; }
small { color:#a2a7b1; }
main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#050505; }
#stage { width:100%; height:100%; }
ruffle-player { width:100%; height:100%; display:block; }
footer { padding:9px 14px; border-top:1px solid #34363b; background:#202329; min-height:48px; }
#feedback { color:#d5d8dd; }
.warning { color:#f2bf69 !important; }
button { color:white; background:#97272c; border:0; border-radius:5px; padding:7px 11px; cursor:pointer; }
button:hover { background:#bb353c; }
</style>
</head>
<body>
<header><div><strong>EVOLVE · Live GFX Preview</strong>
<div><small>Original ActionScript only · native game services disabled</small></div></div>
<button id="reset" type="button">Reset movie</button>
</header>
<main><div id="stage" aria-label="Ruffle interactive Scaleform preview"></div></main>
<footer role="status"><span id="feedback">Loading Ruffle Web…</span></footer>
<script src="./ruffle/ruffle.js"></script>
<script src="./preview.js"></script>
</body>
</html>
